<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 152" role="img" aria-labelledby="title desc"><title id="title">ArticleCraft workflow</title><desc id="desc">Caller supplies author perspective and authorized evidence. A truthful opening and argument gain a claim map, then author revision produces a local draft. Missing evidence returns to the author. No publishing stage.</desc><g font-family="system-ui,sans-serif" fill="#233d4b"><g><rect x="18" y="26" width="162" height="76" rx="9" fill="#edf4f7" stroke="#65808d"/><text x="99" y="57" text-anchor="middle" font-size="15" font-weight="600">Author + packet</text><text x="99" y="81" text-anchor="middle" font-size="11">Authorized context</text></g><path d="M183 64h15m-5-5 5 5-5 5" fill="none" stroke="#91415c" stroke-width="2"/><g><rect x="201" y="26" width="162" height="76" rx="9" fill="#f7edf1" stroke="#65808d"/><text x="282" y="57" text-anchor="middle" font-size="15" font-weight="600">Opening</text><text x="282" y="81" text-anchor="middle" font-size="11">Supplied or labeled</text></g><path d="M366 64h15m-5-5 5 5-5 5" fill="none" stroke="#91415c" stroke-width="2"/><g><rect x="384" y="26" width="162" height="76" rx="9" fill="#edf4f7" stroke="#65808d"/><text x="465" y="57" text-anchor="middle" font-size="15" font-weight="600">Argument</text><text x="465" y="81" text-anchor="middle" font-size="11">Readable layers</text></g><path d="M549 64h15m-5-5 5 5-5 5" fill="none" stroke="#91415c" stroke-width="2"/><g><rect x="567" y="26" width="162" height="76" rx="9" fill="#f7edf1" stroke="#65808d"/><text x="648" y="57" text-anchor="middle" font-size="15" font-weight="600">Claim map</text><text x="648" y="81" text-anchor="middle" font-size="11">Source + limits</text></g><path d="M732 64h15m-5-5 5 5-5 5" fill="none" stroke="#91415c" stroke-width="2"/><g><rect x="750" y="26" width="162" height="76" rx="9" fill="#edf4f7" stroke="#65808d"/><text x="831" y="57" text-anchor="middle" font-size="15" font-weight="600">Author revision</text><text x="831" y="81" text-anchor="middle" font-size="11">Voice + decisions</text></g><path d="M915 64h15m-5-5 5 5-5 5" fill="none" stroke="#91415c" stroke-width="2"/><g><rect x="933" y="26" width="162" height="76" rx="9" fill="#f7edf1" stroke="#65808d"/><text x="1014" y="57" text-anchor="middle" font-size="15" font-weight="600">Local draft</text><text x="1014" y="81" text-anchor="middle" font-size="11">No publication</text></g><text x="555" y="135" text-anchor="middle" font-size="12">Missing evidence → ask, qualify or omit. The author controls the next step.</text></g></svg>

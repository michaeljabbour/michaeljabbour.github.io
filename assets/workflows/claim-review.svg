<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 130" role="img" aria-labelledby="t d"><title id="t">Claim Review workflow</title><desc id="d">Supplied claim and evidence to preserved context, review ledger, then human decision.</desc><rect width="920" height="130" fill="#f4f7fa"/><g fill="#183b56" font-family="system-ui,sans-serif" font-size="17"><text x="22" y="55">Claim + evidence</text><text x="240" y="55">Scope + conflict</text><text x="470" y="55">Review ledger</text><text x="700" y="55">Human decision</text><text x="22" y="100" font-size="14">Missing evidence stays unknown. A structural pass does not certify truth or authorize sharing.</text></g><g stroke="#347e9a" stroke-width="3"><path d="M180 50h40m-10-7 10 7-10 7M410 50h40m-10-7 10 7-10 7M640 50h40m-10-7 10 7-10 7" fill="none"/></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="t d"><title id="t">Idea Talks draft workflow</title><desc id="d">Authorized evidence enters a claim ledger, one story spine, an HTML draft and artifact checks. The output stops at a local draft for human review. No publishing step is implemented.</desc><rect width="1100" height="360" rx="16" fill="#edf4f7"/><style>text{font-family:Arial,sans-serif;fill:#233d4b}.title{font-size:27px;font-weight:700}.label{font-size:20px;font-weight:700}.small{font-size:16px}rect.node{fill:#fff;stroke:#b6ccd7;stroke-width:2}path{fill:none;stroke:#216e67;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#216e67" stroke-width="1.5"/></marker></defs><text x="32" y="47" class="title">One idea. An inspectable path to the draft.</text><g transform="translate(30 92)"><rect class="node" width="185" height="110" rx="9"/><text x="16" y="34" class="label">Authorized</text><text x="16" y="59" class="label">evidence</text><text x="16" y="88" class="small">Audience + sources</text></g><path d="M219 147H246"/><g transform="translate(252 92)"><rect class="node" width="180" height="110" rx="9"/><text x="15" y="34" class="label">Claim ledger</text><text x="15" y="64" class="small">Status + locator</text><text x="15" y="88" class="small">Limits + privacy</text></g><path d="M437 147H462"/><g transform="translate(469 92)"><rect class="node" width="180" height="110" rx="9"/><text x="15" y="34" class="label">Story spine</text><text x="15" y="64" class="small">Idea + example</text><text x="15" y="88" class="small">Invitation</text></g><path d="M653 147H678"/><g transform="translate(685 92)"><rect class="node" width="175" height="110" rx="9"/><text x="15" y="34" class="label">HTML draft</text><text x="15" y="64" class="small">Existing template</text><text x="15" y="88" class="small">No remote assets</text></g><path d="M864 147H889"/><g transform="translate(896 92)"><rect class="node" width="175" height="110" rx="9"/><text x="15" y="34" class="label">Check + review</text><text x="15" y="64" class="small">Export + phone</text><text x="15" y="88" class="small">Sources + print</text></g><rect x="32" y="248" width="1038" height="77" rx="8" fill="#dbeee9"/><text x="50" y="278" class="label">Stop at local drafts: talk.html + story-evidence.md</text><text x="50" y="305" class="small">A human reviews the audience, claims and privacy. Publishing is a separate action and is not implemented.</text></svg>
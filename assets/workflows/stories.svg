<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="410" viewBox="0 0 1160 410" role="img" aria-labelledby="title desc">
<title id="title">Stories: one evidence spine, two reviewable drafts</title>
<desc id="desc">Explicit selected evidence and audience choices feed a shared claim ledger. The caller drafts a case study and one audience adaptation, reviews their consistency and stops at local files. Missing evidence or cancellation returns a gap or stop response. No publishing engine is included.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#53707a" stroke-width="1.5"/></marker></defs>
<rect width="1160" height="410" rx="20" fill="#f0f5f5"/>
<g font-family="system-ui,sans-serif" fill="#233d4b">
<text x="30" y="40" font-size="22" font-weight="700">One evidence spine. Two audiences.</text>
<text x="30" y="65" font-size="14">Caller-applied nonfiction method • Markdown + JSON • local drafts for review</text>
<g fill="#fff" stroke="#a6b9bd"><rect x="30" y="112" width="190" height="122" rx="12"/><rect x="270" y="112" width="210" height="122" rx="12"/><rect x="540" y="90" width="210" height="78" rx="12"/><rect x="540" y="204" width="210" height="78" rx="12"/><rect x="820" y="112" width="295" height="122" rx="12"/></g>
<g font-size="17" font-weight="650"><text x="45" y="142">Select the pack</text><text x="285" y="142">Keep a claim ledger</text><text x="555" y="122">Case study</text><text x="555" y="236">One adaptation</text><text x="835" y="142">Review, then stop</text></g>
<g font-size="14"><text x="45" y="170">Sources • purpose</text><text x="45" y="193">Audiences • visibility</text><text x="45" y="216">Explicit approval bounds</text><text x="285" y="170">Supported / proposed /</text><text x="285" y="193">unsupported • stable IDs</text><text x="285" y="216">Privacy before prose</text><text x="555" y="147">Primary audience + claim IDs</text><text x="555" y="261">Same facts, changed emphasis</text><text x="835" y="170">Facts, limits, privacy, consistency</text><text x="835" y="193">case-study.md + adaptation.md</text><text x="835" y="216">claims.json + review.md</text></g>
<g fill="none" stroke="#53707a" stroke-width="2" marker-end="url(#arrow)"><path d="M220 173 H262"/><path d="M480 156 H507 V129 H532"/><path d="M480 190 H507 V243 H532"/><path d="M750 129 H782 V156 H812"/><path d="M750 243 H782 V190 H812"/></g>
<rect x="30" y="320" width="1085" height="62" rx="10" fill="#e4eeee"/>
<text x="45" y="346" font-size="15" font-weight="650">Insufficient evidence or cancellation → gap / stop response, without invented success or new drafts.</text>
<text x="45" y="368" font-size="14">Optional checker validates structure only. No session mining, document renderer, model loop or publication route is included.</text>
</g></svg>

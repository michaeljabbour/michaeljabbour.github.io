<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Market Fit</title><desc id="desc">Find the problem worth solving. Grow while you do it. An illustrative, jagged growth trace, not measured data.</desc><rect width="1200" height="630" fill="#f6f4ee"/><path d="M60 94H1140M60 560H1140" stroke="#d8d8cc"/><text x="60" y="62" font-family="Arial, sans-serif" font-size="20" fill="#64685e">An Amplifier skill</text><text x="60" y="255" font-family="Georgia, serif" font-size="96" letter-spacing="-4" fill="#252823">Market</text><text x="60" y="352" font-family="Georgia, serif" font-size="96" letter-spacing="-4" fill="#252823">Fit</text><text x="64" y="425" font-family="Arial, sans-serif" font-size="25" fill="#64685e">Find the problem worth solving.</text><text x="64" y="464" font-family="Arial, sans-serif" font-size="25" fill="#64685e">Grow while you do it.</text><rect x="700" y="150" width="420" height="330" fill="#efeee7" stroke="#d8d8cc"/><path d="M730 230H1090M730 320H1090M730 410H1090" stroke="#d8d8cc"/><polyline points="740,410 800,320 860,320 920,410 980,320 1040,230 1080,230" fill="none" stroke="#3d5a73" stroke-width="4" stroke-linejoin="round"/><circle cx="920" cy="410" r="16" fill="none" stroke="#80642f" stroke-width="3"/><circle cx="1080" cy="230" r="9" fill="#3d5a73"/><text x="740" y="520" font-family="Arial, sans-serif" font-size="17" fill="#64685e">Illustrative trace, dips kept. Not measured data.</text></svg>
